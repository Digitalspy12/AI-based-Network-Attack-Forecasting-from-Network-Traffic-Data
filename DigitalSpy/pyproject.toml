[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "digitalspy"
version = "0.1.0"
description = "DigitalSpy — Predictive Cyber Defence: AI-based network attack forecasting prototype"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "torch>=2.0",
    "shap>=0.44",
    "streamlit>=1.35",
    "plotly>=5.18",
    "pyarrow>=14.0",
    "pyyaml>=6.0",
    "requests>=2.31",
    "rich>=13.0",
    "click>=8.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/digitalspy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
